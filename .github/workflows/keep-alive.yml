# Render's free tier stops the API after ~15 idle minutes, which wipes its SQLite disk
# and makes the next request take ~50 s. Pinging it every 10 minutes keeps it running.
# (One always-on service fits inside Render's 750 free instance-hours per month.)
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 120 --retry 2 https://airbnb-clone-api-t2cu.onrender.com/api/health
